[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hybrid-cubic-cg"
version = "0.1.0"
description = "Nonlinear conjugate gradient method with hybrid cubic regularization."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Cassidy K. Buhler" },
    { name = "Hande Y. Benson" },
    { name = "David F. Shanno" },
]
maintainers = [{ name = "Cassidy K. Buhler" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]
keywords = ["optimization", "conjugate gradient", "cubic regularization", "nonlinear optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest", "ruff", "build", "twine"]

[project.urls]
Repository = "https://github.com/cassiebuhler/hybrid-cubic-cg"
Issues = "https://github.com/cassiebuhler/hybrid-cubic-cg/issues"
Changelog = "https://github.com/cassiebuhler/hybrid-cubic-cg/blob/main/CHANGELOG.md"
Paper = "https://doi.org/10.1007/s12532-024-00265-9"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP031"]  # %-formatting is fine
