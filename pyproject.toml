[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybrid-cubic-cg"
version = "0.1.0"
description = "Nonlinear conjugate gradient method with hybrid cubic regularization."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Cassidy K. Buhler" },
    { name = "Hande Y. Benson" },
    { name = "David F. Shanno" },
]
maintainers = [{ name = "Cassidy K. Buhler" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]
keywords = ["optimization", "conjugate gradient", "cubic regularization", "nonlinear optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/cassiebuhler/hybrid-cubic-cg"
Paper = "https://doi.org/10.1007/s12532-024-00265-9"
